    <text x="39" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b3a8c5" letter-spacing="2.5">01 / BEHIND THE HANDLE</text><text x="38" y="113" font-family="Georgia,Times New Roman,serif" font-size="56" fill="#eee9f5" >Lua is my</text><text x="38" y="173" font-family="Georgia,Times New Roman,serif" font-size="56" fill="#bca1ed" font-style="italic">language.</text><text x="40" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#eee9f5" >I&#x27;m Elivien. You may know me as Muiqy.</text><text x="40" y="245" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b3a8c5" >Lua development, scripts and a gothic state of mind.</text><path d="M474 46V263" stroke="#49364f"/><rect x="506" y="42" width="416" height="222" rx="12" fill="#0b0910" stroke="#3a2d45"/><circle cx="527" cy="61" r="4" fill="#8f5e91"/><circle cx="543" cy="61" r="4" fill="#b49a6b"/><circle cx="559" cy="61" r="4" fill="#738b89"/><text x="876" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b3a8c5" text-anchor="end">me.lua</text><path d="M507 79H921" stroke="#302637"/><text x="524" y="109" font-family="Consolas,monospace" font-size="11" fill="#65546e" >1</text><text x="548" y="109" font-family="Consolas,monospace" font-size="15" fill="#c4a4ec" xml:space="preserve">local muiqy = {</text><text x="524" y="133" font-family="Consolas,monospace" font-size="11" fill="#65546e" >2</text><text x="548" y="133" font-family="Consolas,monospace" font-size="15" fill="#e4dced" xml:space="preserve">  name = &quot;Elivien&quot;,</text><text x="524" y="157" font-family="Consolas,monospace" font-size="11" fill="#65546e" >3</text><text x="548" y="157" font-family="Consolas,monospace" font-size="15" fill="#d4b8f3" xml:space="preserve">  language = &quot;Lua&quot;,</text><text x="524" y="181" font-family="Consolas,monospace" font-size="11" fill="#65546e" >4</text><text x="548" y="181" font-family="Consolas,monospace" font-size="15" fill="#bca8d2" xml:space="preserve">  aesthetic = &quot;gothic&quot;</text><text x="524" y="205" font-family="Consolas,monospace" font-size="11" fill="#65546e" >5</text><text x="548" y="205" font-family="Consolas,monospace" font-size="15" fill="#c4a4ec" xml:space="preserve">}</text><text x="524" y="229" font-family="Consolas,monospace" font-size="11" fill="#65546e" >6</text><text x="548" y="229" font-family="Consolas,monospace" font-size="15" fill="#c4a4ec" xml:space="preserve">return muiqy</text><path d="M445 54 Q446 62 454 63 Q446 64 445 72 Q444 64 436 63 Q444 62 445 54Z" fill="#bca1ed"/><path d="M453 241 Q454 245 458 246 Q454 247 453 251 Q452 247 448 246 Q452 245 453 241Z" fill="#bca1ed"/></svg>